<style>
:root{
  --wire-h:184;
  --wire-h0:184;
  --accent-h:161;

  --void:#000000;
  --line:oklch(0.74 0.045 var(--wire-h));
  --line-dim:oklch(0.33 0.035 var(--wire-h));
  --text:oklch(0.92 0.022 var(--wire-h));
  --vertex:oklch(0.72 0.15 var(--accent-h));
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--void);
  color:var(--text);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:15px;
  line-height:1.9;
  -webkit-tap-highlight-color:transparent;
}

.scene{
  position:relative;
  z-index:1;
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:24px;
  perspective:1100px;
}

.rig{
  width:min(460px,100%);
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.3,1);
  will-change:transform;
}

.card{
  position:relative;
  width:100%;
  padding:44px 40px 40px;
  border:1px solid var(--line);
  transform-style:preserve-3d;
  background:
    radial-gradient(circle 3px at 0 0,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 3px at 100% 0,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 3px at 100% 100%,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 3px at 0 100%,var(--vertex) 99%,transparent 100%);
}

.backface{
  position:absolute;
  inset:0;
  border:1px solid var(--line-dim);
  transform:translateZ(-60px);
  pointer-events:none;
}

.wire{
  border:1px solid var(--line);
  background-image:
    radial-gradient(circle 2.5px at 0 0,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 2.5px at 100% 0,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 2.5px at 100% 100%,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 2.5px at 0 100%,var(--vertex) 99%,transparent 100%);
}

.head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:30px;
  transform:translateZ(24px);
}

.avatar{line-height:0;flex-shrink:0}
.avatar img{
  width:60px;
  height:60px;
  display:block;
  filter:hue-rotate(calc((var(--wire-h) - var(--wire-h0)) * 1deg));
}

.tag{
  display:flex;
  align-items:center;
  height:38px;
  padding:0 15px;
  font-size:14px;
  font-weight:500;
  letter-spacing:0.06em;
}
.tag .pro{color:var(--line);margin-left:9px;font-weight:400}

.bio{padding:16px 18px;margin-bottom:34px;transform:translateZ(12px)}

.links{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  transform:translateZ(18px);
}

.links a{
  min-height:46px;
  display:flex;
  align-items:center;
  padding:0 16px;
  font-size:12px;
  letter-spacing:0.08em;
  color:var(--line);
  text-decoration:none;
  transition:color .18s ease,border-color .18s ease;
}
@media (hover:hover){
  .links a:hover{color:var(--vertex);border-color:var(--vertex)}
}
.links a:focus-visible{color:var(--vertex);border-color:var(--vertex);outline:1px solid var(--vertex);outline-offset:4px}

.play{flex:1 1 auto}
.play .arrow{margin-left:auto;padding-left:14px}

.gizmo{
  position:fixed;
  left:22px;
  bottom:20px;
  display:flex;
  flex-direction:column;
  gap:9px;
  font-size:10px;
  letter-spacing:0.1em;
  color:var(--line-dim);
  z-index:5;
}

.ctl{display:flex;align-items:center;gap:10px}
.ctl .lbl{width:44px;flex-shrink:0}
.ctl output{color:var(--line-dim);white-space:nowrap}

.bar{
  position:relative;
  display:block;
  flex-shrink:0;
  width:104px;
  height:16px;
}
.scrub:focus-visible{outline:1px solid var(--vertex);outline-offset:2px}

.scrub{
  -webkit-appearance:none;
  appearance:none;
  position:absolute;
  left:0;
  top:50%;
  translate:0 -50%;
  width:100%;
  height:24px;
  margin:0;
  padding:0;
  background:transparent;
  cursor:ew-resize;
}
.scrub:focus{outline:none}

.scrub::-webkit-slider-runnable-track{height:24px;border:0;background:transparent}
.scrub::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:7px;
  height:24px;
  background:var(--void);
  border:1px solid var(--vertex);
}
.scrub::-moz-range-track{height:24px;border:0;background:transparent}
.scrub::-moz-range-thumb{
  width:7px;
  height:24px;
  border-radius:0;
  background:var(--void);
  border:1px solid var(--vertex);
}

.reset,.tilt{
  display:block;
  align-self:flex-start;
  padding:2px 0;
  border:0;
  background:none;
  font:inherit;
  font-size:10px;
  letter-spacing:0.1em;
  color:var(--line-dim);
  cursor:pointer;
}
.tilt{display:none}
.tilt[hidden]{display:none}

.card>*{animation:draw .5s ease both}
.head{animation-delay:.05s}
.bio{animation-delay:.15s}
.links{animation-delay:.25s}
@keyframes draw{from{opacity:0}to{opacity:1}}

.player{
  position:fixed;
  right:22px;
  bottom:20px;
  z-index:5;
  width:236px;
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:10px;
  letter-spacing:0.08em;
}

.now{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--line);
  white-space:nowrap;
  overflow:hidden;
}
.now span{overflow:hidden;text-overflow:ellipsis}

.bars{display:flex;align-items:flex-end;gap:2px;height:10px;flex-shrink:0}
.bars i{width:2px;height:2px;background:var(--vertex)}
.playing .bars i{animation:eq .9s ease-in-out infinite}
.playing .bars i:nth-child(2){animation-delay:.15s}
.playing .bars i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:2px}50%{height:10px}}

.row{display:flex;align-items:center;gap:9px}

#play,#next{
  width:34px;
  height:34px;
  flex-shrink:0;
  border:1px solid var(--line);
  background:none;
  font:inherit;
  font-size:10px;
  color:var(--line);
  cursor:pointer;
}

.seek{flex:1;height:12px;border:1px solid var(--line);cursor:pointer;touch-action:none}
.seek-fill{height:100%;width:0;background:var(--vertex)}

.times{display:flex;justify-content:space-between;color:var(--line-dim);font-size:9px;padding-left:86px;line-height:1;margin-top:-5px}

#volBar{width:100%;margin-top:11px}

.viz{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}

.gate{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:var(--void);
  font:inherit;
  font-size:13px;
  letter-spacing:0.16em;
  color:var(--line);
  cursor:pointer;
  perspective:700px;
  transition:opacity .6s ease;
}
.gate .wire{
  position:relative;
  padding:17px 28px;
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.3,1);
  will-change:transform;
}
.gate .backface{transform:translateZ(-34px)}
.gate.out{opacity:0;pointer-events:none}

@media (hover:hover){
  .gate .wire:hover,#play:hover,#next:hover{color:var(--vertex);border-color:var(--vertex)}
  .reset:hover,.tilt:hover{color:var(--vertex)}
  .bar:hover,.seek:hover{border-color:var(--vertex)}
}
.gate:focus-visible .wire,#play:focus-visible,#next:focus-visible,.reset:focus-visible,.tilt:focus-visible,.seek:focus-visible{outline:1px solid var(--vertex);outline-offset:3px}


@media (pointer:coarse){
  .scene{padding:24px 24px 132px}
  .ctl{gap:12px}
  .scrub{height:30px}
  .scrub::-webkit-slider-runnable-track{height:30px}
  .scrub::-webkit-slider-thumb{height:22px;margin-top:4px}
  .scrub::-moz-range-track{height:30px}
  .scrub::-moz-range-thumb{height:22px}
  .tilt{display:block}
  .reset,.tilt{padding:8px 0}
  .player{right:16px;bottom:14px}
  #volBar{display:none}
}

@media (max-width:560px){
  body{font-size:14px}
  .scene{padding-left:16px;padding-right:16px}
  .card{padding:30px 20px 26px}
  .avatar img{width:50px;height:50px}
  .tag{height:32px;font-size:12px;padding:0 12px}
  .links{flex-wrap:nowrap;gap:2.4vw}
  .links a{
    font-size:clamp(8px,2.7vw,12px);
    letter-spacing:0.02em;
    padding:0 2.6vw;
    white-space:nowrap;
  }
  .play .arrow{padding-left:2vw}
  .backface{transform:translateZ(-34px)}
  .gizmo{left:16px;bottom:14px;gap:11px;line-height:1}
  .player{width:min(172px,48vw)}
  .ctl output{display:none}
  .bar{width:88px}
}

@media (prefers-reduced-motion:reduce){
  .card>*{animation:none}
  .playing .bars i{animation:none}
  .rig{transition:none}
}
</style>
</head>
<body>

<main class="scene">
  <div class="rig" data-tilt>
    <div class="card">
      <div class="backface" aria-hidden="true"></div>

      <h1 class="head">

<div class="gizmo">
  <label class="ctl">
    <span class="lbl">accent</span>

    <output id="accent-out">oklch(0.72 0.15 161)</output>
  </label>
  <label class="ctl">
    <span class="lbl">wire</span>
    <span class="bar wire"><input class="scrub" type="range" id="wire" min="0" max="360" step="1" value="184" aria-label="Wireframe hue"></span>
    <output id="wire-out">oklch(0.74 0.045 184)</output>

  <button class="reset" id="reset" type="button">reset colours</button>

  <p class="now"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="now">songs for gloomys days :3</span></p>

    <button id="play" type="button" aria-label="Play or pause">&gt;</button>

    <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="seek-fill" id="seekFill"></div>

  </div>
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>

</aside>

<button class="gate" id="gate" type="button"><span class="wire" data-tilt="1.9"><span class="backface" aria-hidden="true"></span>click to enter :3</span></button>
<noscript><style>.gate{display:none}</style></noscript>

<script>
(function(){
  var root=document.documentElement;
  var rigs=[].slice.call(document.querySelectorAll('[data-tilt]'));
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var frame=null;
  var viewY=0,viewX=0;

  function pose(ry,rx){
    viewY=ry||0;
    viewX=rx||0;
    for(var i=0;i<rigs.length;i++){
      var el=rigs[i];
      if(!el.isConnected)continue;
      if(ry===null){el.style.transform='';continue;}
      var k=parseFloat(el.getAttribute('data-tilt'))||1;
      el.style.transform='rotateY('+(ry*k).toFixed(2)+'deg) rotateX('+(rx*k).toFixed(2)+'deg)';
    }
  }
  function tilt(ry,rx){
    if(frame)return;
    frame=requestAnimationFrame(function(){
      frame=null;
      pose(ry,rx);
    });
  }
  function clamp(v,n){return Math.max(-n,Math.min(n,v));}

  if(!reduce&&window.matchMedia('(hover: hover)').matches){
    window.addEventListener('pointermove',function(e){
      tilt((e.clientX/window.innerWidth-0.5)*16,-(e.clientY/window.innerHeight-0.5)*11);
    });
    document.addEventListener('mouseleave',function(){pose(null);});
  }

  var btn=document.getElementById('tilt');
  var gyroOn=false;

  function startGyro(){
    if(gyroOn)return;
    gyroOn=true;
    window.addEventListener('deviceorientation',function(e){
      if(e.gamma===null&&e.beta===null)return;
      tilt(clamp(e.gamma||0,26)*0.62,-clamp((e.beta||0)-40,26)*0.42);
    });
  }

  var wantsGyro=!reduce&&window.matchMedia('(hover: none)').matches&&!!window.DeviceOrientationEvent;
  var needsPerm=wantsGyro&&typeof DeviceOrientationEvent.requestPermission==='function';

  function askGyro(){
    if(!needsPerm||gyroOn)return;
    DeviceOrientationEvent.requestPermission().then(function(state){
      if(state==='granted'){btn.hidden=true;startGyro();}
      else{btn.hidden=false;}
    }).catch(function(){btn.hidden=false;});
  }

  if(wantsGyro&&!needsPerm)startGyro();
  if(needsPerm)btn.addEventListener('click',askGyro);

  var STORE='lpd.hues.3';
  var DEFAULTS={accent:161,wire:184};
  var hues={accent:DEFAULTS.accent,wire:DEFAULTS.wire};
  var setters={};
  var resetBtn=document.getElementById('reset');

  try{
    var saved=JSON.parse(localStorage.getItem(STORE)||'null');
    if(saved){
      if(isFinite(saved.accent))hues.accent=saved.accent;
      if(isFinite(saved.wire))hues.wire=saved.wire;
    }
  }catch(e){}

  function persist(){
    try{localStorage.setItem(STORE,JSON.stringify(hues));}catch(e){}
  }

  function bind(id,prop,key,light,chroma){
    var input=document.getElementById(id);
    var out=document.getElementById(id+'-out');
    function apply(v){
      root.style.setProperty(prop,String(v));
      out.textContent='oklch('+light+' '+chroma+' '+v+')';
    }
    setters[key]=function(v){
      hues[key]=v;
      input.value=v;
      apply(v);
    };
    input.value=hues[key];
    apply(hues[key]);
    input.addEventListener('input',function(){
      hues[key]=Math.round(input.value);
      apply(hues[key]);
    });
    input.addEventListener('change',persist);
  }

  bind('accent','--accent-h','accent','0.72','0.15');
  bind('wire','--wire-h','wire','0.74','0.045');

  resetBtn.addEventListener('click',function(){
    setters.accent(DEFAULTS.accent);
    setters.wire(DEFAULTS.wire);
    try{localStorage.removeItem(STORE);}catch(e){}
  });

  var au=document.getElementById('au');
  var gate=document.getElementById('gate');
  var seek=document.getElementById('seek');
  var fill=document.getElementById('seekFill');
  var curEl=document.getElementById('cur');
  var durEl=document.getElementById('dur');
  var playBtn=document.getElementById('play');
  var vol=document.getElementById('vol');
  var player=document.getElementById('player');
  var nowEl=document.getElementById('now');

  var TRACKS=[
    {src:'songs-for-gloomys-days.mp3',title:'songs for gloomys days :3'},
    {src:'smoke-lounge-mixxx.mp3',title:'smoke lounge mixxx'}
  ];
  var idx=0;

  au.volume=Number(vol.value)/100;

  function cue(i,go){
    idx=(i%TRACKS.length+TRACKS.length)%TRACKS.length;
    nowEl.textContent=TRACKS[idx].title;
    curEl.textContent='0:00';
    durEl.textContent='0:00';
    fill.style.width='0%';
    seek.setAttribute('aria-valuenow','0');
    au.src=TRACKS[idx].src;
    if(go)au.play().catch(function(){});
  }

  au.addEventListener('ended',function(){cue(idx+1,true);});

  document.getElementById('next').addEventListener('click',function(){
    var wasPlaying=!au.paused;
    resume();
    cue(idx+1,wasPlaying);
  });

  function fmt(s){
    s=Math.max(0,Math.floor(s||0));
    var m=Math.floor(s/60);
    s=s%60;
    return m+':'+(s<10?'0':'')+s;
  }

  au.addEventListener('loadedmetadata',function(){durEl.textContent=fmt(au.duration);});
  au.addEventListener('timeupdate',function(){
    if(!au.duration)return;
    var r=au.currentTime/au.duration;
    fill.style.width=(r*100).toFixed(2)+'%';
    seek.setAttribute('aria-valuenow',Math.round(r*100));
    curEl.textContent=fmt(au.currentTime);
  });
  au.addEventListener('play',function(){
    playBtn.textContent='||';
    player.classList.add('playing');
  });
  au.addEventListener('pause',function(){
    playBtn.textContent='>';
    player.classList.remove('playing');
  });

  playBtn.addEventListener('click',function(){
    if(au.paused){resume();au.play().catch(function(){});}
    else au.pause();
  });

  vol.addEventListener('input',function(){au.volume=Number(vol.value)/100;});

  function seekTo(ratio){
    if(!au.duration)return;
    au.currentTime=Math.max(0,Math.min(1,ratio))*au.duration;
  }

  seek.addEventListener('keydown',function(e){
    if(!au.duration)return;
    if(e.key==='ArrowRight')au.currentTime=Math.min(au.duration,au.currentTime+au.duration*0.05);
    else if(e.key==='ArrowLeft')au.currentTime=Math.max(0,au.currentTime-au.duration*0.05);
    else if(e.key==='Home')au.currentTime=0;
    else if(e.key==='End')au.currentTime=Math.max(0,au.duration-1);
    else return;
    e.preventDefault();
  });

  function scrub(e){
    var r=seek.getBoundingClientRect();
    seekTo((e.clientX-r.left)/r.width);
  }

  seek.addEventListener('pointerdown',function(e){
    seek.setPointerCapture(e.pointerId);
    scrub(e);
    function move(ev){scrub(ev);}
    function up(){
      seek.removeEventListener('pointermove',move);
      seek.removeEventListener('pointerup',up);
    }
    seek.addEventListener('pointermove',move);
    seek.addEventListener('pointerup',up);
  });

  var actx=null,analyser=null,data=null;

  function resume(){
    if(!actx){
      var AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      actx=new AC();
      analyser=actx.createAnalyser();
      analyser.fftSize=512;
      analyser.smoothingTimeConstant=0.82;
      actx.createMediaElementSource(au).connect(analyser);
      analyser.connect(actx.destination);
      data=new Uint8Array(analyser.frequencyBinCount);
    }
    if(actx.state==='suspended')actx.resume();
  }

  gate.addEventListener('click',function(){
    gate.classList.add('out');
    gate.setAttribute('aria-hidden','true');
    setTimeout(function(){gate.remove();},700);
    askGyro();
    resume();
    au.play().catch(function(){});
  },{once:true});

  var cv=document.getElementById('viz');
  var cctx=cv.getContext('2d');
  var BANDS=14,DEPTH=420,PERSP=1100;
  var dashes=[],bands=[],bassLv=0,lastT=0,prevW=0,prevH=0;
  var mx=-9999,my=-9999;
  var REACH=85,FORCE=3200,MAXV=300,COLL=900;

  window.addEventListener('pointermove',function(e){mx=e.clientX;my=e.clientY;});
  window.addEventListener('pointerdown',function(e){mx=e.clientX;my=e.clientY;});
  document.addEventListener('mouseleave',function(){mx=-9999;my=-9999;});

  (function buildBands(){
    var lo=2,hi=184;
    for(var i=0;i<BANDS;i++){
      var s=Math.floor(lo*Math.pow(hi/lo,i/BANDS));
      var e=Math.floor(lo*Math.pow(hi/lo,(i+1)/BANDS));
      if(e<=s)e=s+1;
      bands.push([s,Math.min(e,hi),0]);
    }
  })();

  function makeDash(W,H){
    var z=(Math.random()*2-1)*DEPTH;
    var s=PERSP/(PERSP-z);
    return {
      x:(Math.random()-0.5)*(W+140)/s,
      y:(Math.random()-0.5)*(H+140)/s,
      z:z,
      vx:(Math.random()-0.5)*26,
      vy:(Math.random()-0.5)*26,
      cx:(Math.random()-0.5)*22,
      cy:(Math.random()-0.5)*18,
      ang:Math.random()*Math.PI,
      av:(Math.random()-0.5)*0.4,
      hand:Math.random()<0.5?-1:1,
      len:14+Math.random()*34,
      band:Math.floor(Math.random()*BANDS),
      sx:0,sy:0,s:1,zr:0,glow:0
    };
  }

  function fit(){
    var d=window.devicePixelRatio||1;
    var W=window.innerWidth,H=window.innerHeight;
    cv.width=Math.round(W*d);
    cv.height=Math.round(H*d);
    cctx.setTransform(d,0,0,d,0,0);

    if(prevW&&prevH){
      var kx=W/prevW,ky=H/prevH;
      for(var i=0;i<dashes.length;i++){dashes[i].x*=kx;dashes[i].y*=ky;}
    }
    prevW=W;prevH=H;

    var want=Math.max(24,Math.min(90,Math.round(W*H/26000)));
    while(dashes.length<want)dashes.push(makeDash(W,H));
    if(dashes.length>want)dashes.length=want;
  }

  function keepOut(){
    var out=[],pad=16;
    var els=[document.querySelector('.card'),document.querySelector('.gizmo'),document.getElementById('player')];
    for(var i=0;i<els.length;i++){
      if(!els[i]||!els[i].isConnected)continue;
      var r=els[i].getBoundingClientRect();
      if(r.width<1)continue;
      out.push({t:r.top-pad,b:r.bottom+pad,l:r.left-pad,r:r.right+pad});
    }
    return out;
  }

  var cosX=1,sinX=0,cosY=1,sinY=0,ox0=0,oy0=0;

  function proj(x,y,z,out){
    var y1=y*cosX-z*sinX;
    var z1=y*sinX+z*cosX;
    var x2=x*cosY+z1*sinY;
    var z2=-x*sinY+z1*cosY;
    var s=PERSP/(PERSP-z2);
    out[0]=ox0+x2*s;
    out[1]=oy0+y1*s;
    out[2]=s;
    out[3]=z2;
    return out;
  }

  var tmp=[0,0,0,0],e1=[0,0,0,0],e2=[0,0,0,0];

  function draw(now){
    requestAnimationFrame(draw);
    var dt=Math.min(0.05,(now-lastT)/1000||0);
    lastT=now;

    var W=window.innerWidth,H=window.innerHeight;
    cctx.clearRect(0,0,W,H);

    ox0=W/2;oy0=H/2;
    var rx=viewX*Math.PI/180,ry=viewY*Math.PI/180;
    cosX=Math.cos(rx);sinX=Math.sin(rx);
    cosY=Math.cos(ry);sinY=Math.sin(ry);

    var live=analyser&&!au.paused;
    if(live)analyser.getByteFrequencyData(data);

    var bass=0;
    if(live){
      for(var j=2;j<14;j++)bass+=data[j];
      bass=bass/12/255;
    }
    bassLv+=(bass-bassLv)*(bass>bassLv?0.4:0.06);

    for(var b=0;b<BANDS;b++){
      var v=0;
      if(live){
        var rg=bands[b],sum=0;
        for(var k=rg[0];k<rg[1];k++)sum+=data[k];
        v=sum/(rg[1]-rg[0])/255;
        v*=0.8+1.2*(b/BANDS);
        if(v>1)v=1;
      }
      bands[b][2]+=(v-bands[b][2])*(v>bands[b][2]?0.55:0.06);
    }

    var n=dashes.length,i,d;

    for(i=0;i<n;i++){
      d=dashes[i];
      proj(d.x,d.y,d.z,tmp);
      d.sx=tmp[0];d.sy=tmp[1];d.s=tmp[2];d.zr=tmp[3];

      var dx=d.sx-mx,dy=d.sy-my;
      var md=Math.sqrt(dx*dx+dy*dy);
      if(md<REACH&&md>0.01){
        var f=1-md/REACH;
        var acc=f*f*FORCE*dt/d.s;
        d.vx+=(dx/md)*acc;
        d.vy+=(dy/md)*acc;
        d.av+=d.hand*f*f*2.4*dt;
        d.glow=f*f;
      }else{
        d.glow*=0.9;
      }
      d.vx+=(Math.random()-0.5)*(6+bassLv*60)*dt;
      d.vy+=(Math.random()-0.5)*(6+bassLv*60)*dt;
    }

    for(i=0;i<n;i++){
      var a=dashes[i];
      for(var q=i+1;q<n;q++){
        var c=dashes[q];
        var px=c.x-a.x,py=c.y-a.y,pz=c.z-a.z;
        var d2=px*px+py*py+pz*pz;
        var rr=(a.len+c.len)*0.34;
        if(d2<rr*rr&&d2>0.05){
          var dist=Math.sqrt(d2);
          var imp=(1-dist/rr)*COLL*dt;
          var nx=px/dist,ny=py/dist;
          a.vx-=nx*imp;a.vy-=ny*imp;
          c.vx+=nx*imp;c.vy+=ny*imp;
        }
      }
    }

    var blocks=keepOut();
    var damp=Math.pow(0.975,dt*60);

    for(i=0;i<n;i++){
      d=dashes[i];
      d.vx=d.cx+(d.vx-d.cx)*damp;
      d.vy=d.cy+(d.vy-d.cy)*damp;
      d.av*=damp;

      var sp=Math.sqrt(d.vx*d.vx+d.vy*d.vy);
      if(sp>MAXV){d.vx=d.vx/sp*MAXV;d.vy=d.vy/sp*MAXV;}

      d.x+=d.vx*dt;
      d.y+=d.vy*dt;
      d.ang+=d.av*dt;

      for(var s2=0;s2<blocks.length;s2++){
        var bl=blocks[s2];
        var wl=(bl.l-ox0)/d.s,wr=(bl.r-ox0)/d.s;
        var wt=(bl.t-oy0)/d.s,wb=(bl.b-oy0)/d.s;
        if(d.x>wl&&d.x<wr&&d.y>wt&&d.y<wb){
          var dl=d.x-wl,dr2=wr-d.x,du=d.y-wt,dd=wb-d.y;
          var m=Math.min(dl,dr2,du,dd);
          if(m===dl){d.x=wl;d.vx=-Math.abs(d.vx)-12;}
          else if(m===dr2){d.x=wr;d.vx=Math.abs(d.vx)+12;}
          else if(m===du){d.y=wt;d.vy=-Math.abs(d.vy)-12;}
          else{d.y=wb;d.vy=Math.abs(d.vy)+12;}
        }
      }

      var hw=(W/2+70)/d.s,hh=(H/2+70)/d.s;
      if(d.x<-hw)d.x=hw; else if(d.x>hw)d.x=-hw;
      if(d.y<-hh)d.y=hh; else if(d.y>hh)d.y=-hh;
    }

    dashes.sort(function(p,q){return p.zr-q.zr;});

    var wire='oklch(0.74 0.045 '+hues.wire+')';
    var accent='oklch(0.72 0.15 '+hues.accent+')';

    for(i=0;i<n;i++){
      d=dashes[i];
      var lv=bands[d.band][2];
      var half=d.len*(0.7+0.55*lv+0.3*d.glow)/2;
      var ca=Math.cos(d.ang)*half,sa=Math.sin(d.ang)*half;

      proj(d.x-ca,d.y-sa,d.z,e1);
      proj(d.x+ca,d.y+sa,d.z,e2);

      var fade=Math.min(1.1,Math.max(0.25,d.s*0.78));
      cctx.lineWidth=Math.max(0.6,1.25*d.s*0.85);
      cctx.globalAlpha=Math.min(0.85,(0.09+0.5*lv+0.16*bassLv+0.26*d.glow)*fade);
      cctx.strokeStyle=lv>0.55?accent:wire;
      cctx.beginPath();
      cctx.moveTo(e1[0],e1[1]);
      cctx.lineTo(e2[0],e2[1]);
      cctx.stroke();
    }
    cctx.globalAlpha=1;
  }

  fit();
  window.addEventListener('resize',fit);
  if(!reduce)requestAnimationFrame(draw);

})();
</script>

</body>
</html>
