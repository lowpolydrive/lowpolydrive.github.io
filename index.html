<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>:3</title>
<meta name="description" content="hello! i literally don't know what to put here but i'll do something meaningful sometime! :>">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Cstyle%3Etext%7Bfill:%233F8F80%7D%40media%28prefers-color-scheme:dark%29%7Btext%7Bfill:%237FCFBE%7D%7D%3C/style%3E%3Ctext%20x='16'%20y='22.6'%20text-anchor='middle'%20font-family='ui-monospace%2CSFMono-Regular%2CMenlo%2CConsolas%2Cmonospace'%20font-size='19'%20font-weight='500'%3E:3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --wire-h:185;
  --accent-h:150;

  --void:#000000;
  --line:oklch(0.74 0.045 var(--wire-h));
  --line-dim:oklch(0.33 0.035 var(--wire-h));
  --text:oklch(0.92 0.022 var(--wire-h));
  --vertex:oklch(0.72 0.15 var(--accent-h));
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--void);
  color:var(--text);
  font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:15px;
  line-height:1.9;
  -webkit-tap-highlight-color:transparent;
}

.scene{
  min-height:100vh;
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:24px;
  perspective:1100px;
}

.rig{
  width:min(460px,100%);
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.3,1);
  will-change:transform;
}

.card{
  position:relative;
  width:100%;
  padding:44px 40px 40px;
  border:1px solid var(--line);
  transform-style:preserve-3d;
  background:
    radial-gradient(circle 3px at 0 0,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 3px at 100% 0,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 3px at 100% 100%,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 3px at 0 100%,var(--vertex) 99%,transparent 100%);
}

.backface{
  position:absolute;
  inset:0;
  border:1px solid var(--line-dim);
  transform:translateZ(-60px);
  pointer-events:none;
}

.wire{
  border:1px solid var(--line);
  background-image:
    radial-gradient(circle 2.5px at 0 0,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 2.5px at 100% 0,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 2.5px at 100% 100%,var(--vertex) 99%,transparent 100%),
    radial-gradient(circle 2.5px at 0 100%,var(--vertex) 99%,transparent 100%);
}

.head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:30px;
  transform:translateZ(24px);
}

.avatar{line-height:0;flex-shrink:0}
.avatar img{width:60px;height:60px;display:block}

.tag{
  display:flex;
  align-items:center;
  height:38px;
  padding:0 15px;
  font-size:14px;
  font-weight:500;
  letter-spacing:0.06em;
}
.tag .pro{color:var(--line);margin-left:9px;font-weight:400}

.bio{padding:16px 18px;margin-bottom:34px;transform:translateZ(12px)}

.links{
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  transform:translateZ(18px);
}

.links a{
  min-height:46px;
  display:flex;
  align-items:center;
  padding:0 16px;
  font-size:12px;
  letter-spacing:0.08em;
  color:var(--line);
  text-decoration:none;
  transition:color .18s ease,border-color .18s ease;
}
@media (hover:hover){
  .links a:hover{color:var(--vertex);border-color:var(--vertex)}
}
.links a:focus-visible{color:var(--vertex);border-color:var(--vertex);outline:1px solid var(--vertex);outline-offset:4px}

.play{flex:1 1 auto}
.play .arrow{margin-left:auto;padding-left:14px}

.gizmo{
  position:fixed;
  left:22px;
  bottom:20px;
  display:flex;
  flex-direction:column;
  gap:9px;
  font-size:10px;
  letter-spacing:0.1em;
  color:var(--line-dim);
  z-index:5;
}

.ctl{display:flex;align-items:center;gap:10px}
.ctl .lbl{width:44px;flex-shrink:0}
.ctl output{color:var(--line-dim);white-space:nowrap}

.bar{
  position:relative;
  display:block;
  flex-shrink:0;
  width:104px;
  height:16px;
}
.scrub:focus-visible{outline:1px solid var(--vertex);outline-offset:2px}

.scrub{
  -webkit-appearance:none;
  appearance:none;
  position:absolute;
  left:0;
  top:50%;
  translate:0 -50%;
  width:100%;
  height:24px;
  margin:0;
  padding:0;
  background:transparent;
  cursor:ew-resize;
}
.scrub:focus{outline:none}

.scrub::-webkit-slider-runnable-track{height:24px;border:0;background:transparent}
.scrub::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:7px;
  height:24px;
  background:var(--void);
  border:1px solid var(--vertex);
}
.scrub::-moz-range-track{height:24px;border:0;background:transparent}
.scrub::-moz-range-thumb{
  width:7px;
  height:24px;
  border-radius:0;
  background:var(--void);
  border:1px solid var(--vertex);
}

.tilt{
  display:none;
  align-items:center;
  align-self:flex-start;
  min-height:44px;
  padding:0 14px;
  background:none;
  font:inherit;
  font-size:10px;
  letter-spacing:0.1em;
  color:var(--line);
  cursor:pointer;
}
.tilt[hidden]{display:none}

.card>*{animation:draw .5s ease both}
.head{animation-delay:.05s}
.bio{animation-delay:.15s}
.links{animation-delay:.25s}
@keyframes draw{from{opacity:0}to{opacity:1}}

.player{
  position:fixed;
  right:22px;
  bottom:20px;
  z-index:5;
  width:236px;
  display:flex;
  flex-direction:column;
  gap:8px;
  font-size:10px;
  letter-spacing:0.08em;
}

.now{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--line);
  white-space:nowrap;
  overflow:hidden;
}
.now span{overflow:hidden;text-overflow:ellipsis}

.bars{display:flex;align-items:flex-end;gap:2px;height:10px;flex-shrink:0}
.bars i{width:2px;height:2px;background:var(--vertex)}
.playing .bars i{animation:eq .9s ease-in-out infinite}
.playing .bars i:nth-child(2){animation-delay:.15s}
.playing .bars i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:2px}50%{height:10px}}

.row{display:flex;align-items:center;gap:9px}

#play{
  width:34px;
  height:34px;
  flex-shrink:0;
  border:1px solid var(--line);
  background:none;
  font:inherit;
  font-size:10px;
  color:var(--line);
  cursor:pointer;
}

.seek{flex:1;height:12px;border:1px solid var(--line);cursor:pointer;touch-action:none}
.seek-fill{height:100%;width:0;background:var(--vertex)}

.times{display:flex;justify-content:space-between;color:var(--line-dim);font-size:9px;padding-left:43px;line-height:1;margin-top:-5px}

#volBar{width:100%;margin-top:11px}

#sc{position:absolute;width:0;height:0;border:0;opacity:0;pointer-events:none}

.gate{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  border:0;
  background:var(--void);
  font:inherit;
  font-size:13px;
  letter-spacing:0.16em;
  color:var(--line);
  cursor:pointer;
  perspective:700px;
  transition:opacity .6s ease;
}
.gate .wire{
  position:relative;
  padding:17px 28px;
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.8,.3,1);
  will-change:transform;
}
.gate .backface{transform:translateZ(-34px)}
.gate.out{opacity:0;pointer-events:none}

@media (hover:hover){
  .gate .wire:hover,#play:hover{color:var(--vertex);border-color:var(--vertex)}
  .bar:hover,.seek:hover{border-color:var(--vertex)}
}
.gate:focus-visible .wire,#play:focus-visible,.seek:focus-visible{outline:1px solid var(--vertex);outline-offset:3px}


@media (pointer:coarse){
  .scene{padding:24px 24px 132px}
  .ctl{gap:12px}
  .scrub{height:30px}
  .scrub::-webkit-slider-runnable-track{height:30px}
  .scrub::-webkit-slider-thumb{height:22px;margin-top:4px}
  .scrub::-moz-range-track{height:30px}
  .scrub::-moz-range-thumb{height:22px}
  .tilt{display:flex}
  .player{right:16px;bottom:14px}
  #volBar{display:none}
}

@media (max-width:560px){
  body{font-size:14px}
  .scene{padding-left:16px;padding-right:16px}
  .card{padding:30px 20px 26px}
  .avatar img{width:50px;height:50px}
  .tag{height:32px;font-size:12px;padding:0 12px}
  .links{flex-wrap:nowrap;gap:2.4vw}
  .links a{
    font-size:clamp(8px,2.7vw,12px);
    letter-spacing:0.02em;
    padding:0 2.6vw;
    white-space:nowrap;
  }
  .play .arrow{padding-left:2vw}
  .backface{transform:translateZ(-34px)}
  .gizmo{left:16px;bottom:14px;gap:11px;line-height:1}
  .player{width:min(172px,48vw)}
  .ctl output{display:none}
  .bar{width:88px}
}

@media (prefers-reduced-motion:reduce){
  .card>*{animation:none}
  .playing .bars i{animation:none}
  .rig{transition:none}
}
</style>
</head>
<body>

<main class="scene">
  <div class="rig" data-tilt>
    <div class="card">
      <div class="backface" aria-hidden="true"></div>

      <h1 class="head">
        <span class="wire avatar"><img src="kitty.webp" width="60" height="60" alt="" decoding="async"></span>
        <span class="wire tag">cutekibby<span class="pro">any</span></span>
      </h1>

      <div class="wire bio">
        <p>hello! i literally don't know what to put here but i'll do something meaningful sometime! :&gt;</p>
      </div>

      <nav class="links">
        <a class="wire" href="https://discord.gg/czMBZYxS" target="_blank" rel="noopener">discord</a>

        <a class="wire" href="https://github.com/cutekibby" target="_blank" rel="noopener">github</a>

        <a class="wire play" href="/drive/">
          <span>lowpoly drive</span>
          <span class="arrow" aria-hidden="true">-&gt;</span>
        </a>
      </nav>
    </div>
  </div>
</main>

<div class="gizmo">
  <label class="ctl">
    <span class="lbl">accent</span>
    <span class="bar wire"><input class="scrub" type="range" id="accent" min="0" max="360" step="1" value="150" aria-label="Accent hue"></span>
    <output id="accent-out">oklch(0.72 0.15 150)</output>
  </label>
  <label class="ctl">
    <span class="lbl">wire</span>
    <span class="bar wire"><input class="scrub" type="range" id="wire" min="0" max="360" step="1" value="185" aria-label="Wireframe hue"></span>
    <output id="wire-out">oklch(0.74 0.045 185)</output>
  </label>
  <button class="wire tilt" id="tilt" type="button" hidden>enable tilt</button>
</div>

<aside class="player" id="player">
  <p class="now"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span><span id="now">&hellip;</span></p>
  <div class="row">
    <button id="play" type="button" aria-label="Play or pause">&gt;</button>
    <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="seek-fill" id="seekFill"></div>
    </div>
  </div>
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <span class="bar wire" id="volBar"><input class="scrub" type="range" id="vol" min="0" max="100" value="25" aria-label="Music volume"></span>
</aside>

<button class="gate" id="gate" type="button"><span class="wire" data-tilt="1.9"><span class="backface" aria-hidden="true"></span>click to enter :3</span></button>
<noscript><style>.gate{display:none}</style></noscript>

<script>
(function(){
  var root=document.documentElement;
  var rigs=[].slice.call(document.querySelectorAll('[data-tilt]'));
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var frame=null;
  function pose(ry,rx){
    for(var i=0;i<rigs.length;i++){
      var el=rigs[i];
      if(!el.isConnected)continue;
      if(ry===null){el.style.transform='';continue;}
      var k=parseFloat(el.getAttribute('data-tilt'))||1;
      el.style.transform='rotateY('+(ry*k).toFixed(2)+'deg) rotateX('+(rx*k).toFixed(2)+'deg)';
    }
  }
  function tilt(ry,rx){
    if(frame)return;
    frame=requestAnimationFrame(function(){
      frame=null;
      pose(ry,rx);
    });
  }
  function clamp(v,n){return Math.max(-n,Math.min(n,v));}

  if(!reduce&&window.matchMedia('(hover: hover)').matches){
    window.addEventListener('pointermove',function(e){
      tilt((e.clientX/window.innerWidth-0.5)*16,-(e.clientY/window.innerHeight-0.5)*11);
    });
    document.addEventListener('mouseleave',function(){pose(null);});
  }

  var btn=document.getElementById('tilt');
  var gyroOn=false;

  function startGyro(){
    if(gyroOn)return;
    gyroOn=true;
    window.addEventListener('deviceorientation',function(e){
      if(e.gamma===null&&e.beta===null)return;
      tilt(clamp(e.gamma||0,26)*0.62,-clamp((e.beta||0)-40,26)*0.42);
    });
  }

  var wantsGyro=!reduce&&window.matchMedia('(hover: none)').matches&&!!window.DeviceOrientationEvent;
  var needsPerm=wantsGyro&&typeof DeviceOrientationEvent.requestPermission==='function';

  function askGyro(){
    if(!needsPerm||gyroOn)return;
    DeviceOrientationEvent.requestPermission().then(function(state){
      if(state==='granted'){btn.hidden=true;startGyro();}
      else{btn.hidden=false;}
    }).catch(function(){btn.hidden=false;});
  }

  if(wantsGyro&&!needsPerm)startGyro();
  if(needsPerm)btn.addEventListener('click',askGyro);

  var STORE='lpd.hues.2';
  var hues={accent:150,wire:185};

  try{
    var saved=JSON.parse(localStorage.getItem(STORE)||'null');
    if(saved){
      if(isFinite(saved.accent))hues.accent=saved.accent;
      if(isFinite(saved.wire))hues.wire=saved.wire;
    }
  }catch(e){}

  function persist(){
    try{localStorage.setItem(STORE,JSON.stringify(hues));}catch(e){}
  }

  function bind(id,prop,key,light,chroma){
    var input=document.getElementById(id);
    var out=document.getElementById(id+'-out');
    function apply(v){
      root.style.setProperty(prop,String(v));
      out.textContent='oklch('+light+' '+chroma+' '+v+')';
    }
    input.value=hues[key];
    apply(hues[key]);
    input.addEventListener('input',function(){
      hues[key]=Math.round(input.value);
      apply(hues[key]);
    });
    input.addEventListener('change',persist);
  }

  bind('accent','--accent-h','accent','0.72','0.15');
  bind('wire','--wire-h','wire','0.74','0.045');

  var TRACK='https://soundcloud.com/111loggedin/u21va2ugtg91bmdlie1pehh4ihwgtn';
  var player=document.getElementById('player');
  var gate=document.getElementById('gate');
  var nowEl=document.getElementById('now');
  var seek=document.getElementById('seek');
  var fill=document.getElementById('seekFill');
  var curEl=document.getElementById('cur');
  var durEl=document.getElementById('dur');
  var playBtn=document.getElementById('play');
  var vol=document.getElementById('vol');
  var widget=null,duration=0,booting=false,entered=false;

  function fmt(ms){
    var s=Math.max(0,Math.floor((ms||0)/1000));
    var m=Math.floor(s/60);
    s=s%60;
    return m+':'+(s<10?'0':'')+s;
  }

  function sync(){
    if(!widget)return;
    widget.getCurrentSound(function(sound){
      if(sound&&sound.title)nowEl.textContent=sound.title.toLowerCase();
    });
    widget.getDuration(function(d){duration=d||0;durEl.textContent=fmt(d);});
  }

  function boot(){
    if(widget||booting)return;
    booting=true;

    var iframe=document.createElement('iframe');
    iframe.id='sc';
    iframe.allow='autoplay';
    iframe.src='https://w.soundcloud.com/player/?url='+encodeURIComponent(TRACK)+
      '&auto_play=false&visual=false&hide_related=true&show_comments=false&show_user=false';
    player.appendChild(iframe);

    var api=document.createElement('script');
    api.src='https://w.soundcloud.com/player/api.js';
    api.onerror=function(){nowEl.textContent='player unavailable';};
    api.onload=function(){
      var E=window.SC.Widget.Events;
      widget=window.SC.Widget(iframe);
      widget.bind(E.READY,function(){
        widget.setVolume(Number(vol.value));
        sync();
        if(entered)start();
      });
      widget.bind(E.PLAY,function(){
        player.classList.add('playing');
        playBtn.textContent='||';
        widget.setVolume(Number(vol.value));
        sync();
      });
      widget.bind(E.PAUSE,function(){
        player.classList.remove('playing');
        playBtn.textContent='>';
      });
      widget.bind(E.FINISH,function(){
        widget.seekTo(0);
        widget.play();
      });
      widget.bind(E.PLAY_PROGRESS,function(e){
        var pct=(e.relativePosition||0)*100;
        fill.style.width=pct.toFixed(2)+'%';
        seek.setAttribute('aria-valuenow',Math.round(pct));
        curEl.textContent=fmt(e.currentPosition);
      });
    };
    document.head.appendChild(api);
  }

  boot();

  function start(){
    if(!widget)return;
    widget.setVolume(Number(vol.value));
    widget.play();
  }

  gate.addEventListener('click',function(){
    entered=true;
    askGyro();
    gate.classList.add('out');
    gate.setAttribute('aria-hidden','true');
    setTimeout(function(){gate.remove();},700);
    start();
  },{once:true});

  playBtn.addEventListener('click',function(){if(widget)widget.toggle();});
  vol.addEventListener('input',function(){if(widget)widget.setVolume(Number(vol.value));});

  function scrub(e){
    if(!widget||!duration)return;
    var r=seek.getBoundingClientRect();
    var ratio=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    widget.seekTo(ratio*duration);
    fill.style.width=(ratio*100).toFixed(2)+'%';
  }

  seek.addEventListener('keydown',function(e){
    if(!widget||!duration)return;
    var step=duration*0.05,target=null;
    if(e.key==='ArrowRight')target='+';
    else if(e.key==='ArrowLeft')target='-';
    else if(e.key==='Home')target=0;
    else if(e.key==='End')target=duration-1000;
    else return;
    e.preventDefault();
    if(typeof target==='number'){widget.seekTo(Math.max(0,target));return;}
    widget.getPosition(function(p){
      var t=target==='+'?p+step:p-step;
      widget.seekTo(Math.max(0,Math.min(duration,t)));
    });
  });

  seek.addEventListener('pointerdown',function(e){
    seek.setPointerCapture(e.pointerId);
    scrub(e);
    function move(ev){scrub(ev);}
    function up(){
      seek.removeEventListener('pointermove',move);
      seek.removeEventListener('pointerup',up);
    }
    seek.addEventListener('pointermove',move);
    seek.addEventListener('pointerup',up);
  });
})();
</script>

</body>
</html>
